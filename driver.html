<!DOCTYPE html>
<html>

<head>

    <title>RideSync Driver Panel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>🚌 RideSync Driver Panel</h1>

    <div class="bus-card">

        <h3>Update Bus Location</h3>

        <label for="busSelect">
            Select Bus:
        </label>

        <select id="busSelect">

            <option value="bus1">
                Bus 1
            </option>

            <option value="bus2">
                Bus 2
            </option>

        </select>

        <br><br>

        <label for="stopSelect">
            Select Current Stop:
        </label>

        <select id="stopSelect">

        </select>

        <br><br>

        <button onclick="updateBusLocation()">
            Update Location
        </button>

        <p id="updateMessage"></p>

        <hr>

        <h3>📍 Live GPS Tracking</h3>

        <button onclick="startGPS()">
            Start Live GPS
        </button>

        <p id="gpsStatus">
            GPS not started
        </p>

        <p>
            <strong>Latitude:</strong>
            <span id="latitude">--</span>
        </p>

        <p>
            <strong>Longitude:</strong>
            <span id="longitude">--</span>
        </p>

    </div>

    <script
        src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
